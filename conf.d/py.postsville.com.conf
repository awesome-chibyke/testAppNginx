server {
    # default_server: also answer for localhost (local dev, CI smoke test)
    listen 80;
    server_name py.postsville.com;

    # Docker's internal DNS. Re-resolving `web` every few seconds means a
    # recreated web container (new IP after a deploy) is picked up without
    # restarting nginx, and nginx can start before `web` exists.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://python_web:5000;

    client_max_body_size 10m;

    location / {
        proxy_pass $web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}