server {
    listen 80;
    server_name db.philelite.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name db.philelite.com;

    ssl_certificate     /etc/nginx/certs/philelite.pem;
    ssl_certificate_key /etc/nginx/certs/philelite.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/certs/philelite-pma.htpasswd;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pma_upstream http://philelite-pma:80;

    client_max_body_size 256M;

    location / {
        proxy_pass $pma_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
