# Plain HTTP for every philelite.com name: send to HTTPS.
# The bare domain goes straight to the store so it's a single hop.
server {
    listen 80;
    server_name philelite.com www.philelite.com;

    return 302 https://store.philelite.com$request_uri;
}

server {
    listen 80;
    server_name store.philelite.com;

    return 301 https://$host$request_uri;
}

# https://philelite.com (and www) -> the store.
# 302 = temporary, so browsers don't cache it forever. Switch to 301 once
# you're sure philelite.com will never host its own site.
server {
    listen 443 ssl;
    http2 on;
    server_name philelite.com www.philelite.com;

    ssl_certificate     /etc/nginx/certs/philelite.pem;
    ssl_certificate_key /etc/nginx/certs/philelite.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 302 https://store.philelite.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name store.philelite.com;

    # Cert files live on the server in <DEPLOY_DIR>/certs (never in git),
    # mounted read-only by docker-compose.yml. This cert must cover
    # philelite.com, www.philelite.com and store.philelite.com.
    ssl_certificate     /etc/nginx/certs/philelite.pem;
    ssl_certificate_key /etc/nginx/certs/philelite.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Turn on once HTTPS is confirmed working: browsers will then refuse
    # plain HTTP for this domain for the max-age period.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Docker's internal DNS. Re-resolving the app every few seconds means a
    # recreated app container (new IP after a deploy) is picked up without
    # restarting nginx, and nginx can start before the app exists.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://mixpost:80;

    client_max_body_size 200M;

    location / {
        proxy_pass $web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
