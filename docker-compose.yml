services:
  nginx:
    image: nginx:stable-alpine
    container_name: edge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks: [nginx-edge]

networks:
  nginx-edge:
    external: true